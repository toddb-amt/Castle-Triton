apply plugin: 'com.android.application'

// Release signing is loaded from keystore.properties (project root) which holds
// the keystore path + passwords. That file and the .jks are kept OUT of the APK
// and out of version control — back them up separately; losing the key means no
// future update can be installed over a release-signed terminal. If the file is
// absent (e.g. a fresh checkout without the key), release builds stay unsigned so
// the project still configures.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// Built-in Super Admin PIN (SEC-05, 6.2.18). admin-pins.properties (project root, git-ignored,
// template in admin-pins.properties.example) holds default_super_admin_pin=<6 to 8 digits>. The
// build hashes it here — PBKDF2-SHA256, 50 000 rounds, 32 bytes, lowercase hex, the SAME routine as
// castech.emvtxn.admin.AdminPins (pinned by AdminPinsTest.hash_matchesIndependentPbkdf2Vector) —
// under a salt made fresh for each build (or built_in_pin_salt=<32 hex> from the file), and ships
// only hash + salt in BuildConfig. The clear PIN never enters the APK, the repo or the logs.
// Release builds refuse to run without a valid file; debug builds warn and carry no built-in PIN.
def adminPinsFile = rootProject.file("admin-pins.properties")
def builtInSuperPinHash = ""
def builtInPinSalt = ""
def adminPinsProblem = null
if (adminPinsFile.exists()) {
    def adminPinsProps = new Properties()
    adminPinsFile.withInputStream { adminPinsProps.load(it) }
    def pin = (adminPinsProps['default_super_admin_pin'] ?: '').trim()
    def saltHex = (adminPinsProps['built_in_pin_salt'] ?: '').trim().toLowerCase()
    if (!(pin ==~ /[0-9]{6,8}/)) {
        adminPinsProblem = "admin-pins.properties: default_super_admin_pin must be 6 to 8 digits"
    } else if (!saltHex.isEmpty() && !(saltHex ==~ /[0-9a-f]{32}/)) {
        adminPinsProblem = "admin-pins.properties: built_in_pin_salt must be 32 hex characters when present"
    } else {
        byte[] salt
        if (saltHex.isEmpty()) {
            salt = new byte[16]
            new java.security.SecureRandom().nextBytes(salt)
        } else {
            salt = saltHex.decodeHex()
        }
        def spec = new javax.crypto.spec.PBEKeySpec(pin.toCharArray(), salt, 50000, 256)
        byte[] out = javax.crypto.SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256").generateSecret(spec).getEncoded()
        builtInSuperPinHash = out.encodeHex().toString()
        builtInPinSalt = salt.encodeHex().toString()
    }
} else {
    adminPinsProblem = "admin-pins.properties not found in " + rootProject.projectDir + " — this build has NO built-in Super Admin PIN (copy admin-pins.properties.example and fill it in)"
}
if (adminPinsProblem != null) {
    logger.warn("WARNING: " + adminPinsProblem)
}
// A release APK without the built-in PIN would lock TFI out of every fresh terminal: refuse.
gradle.taskGraph.whenReady { graph ->
    boolean releaseRequested = graph.allTasks.any { t ->
        t.project == project && t.name.contains("Release") && (t.name.startsWith("assemble") || t.name.startsWith("package") || t.name.startsWith("bundle"))
    }
    if (releaseRequested && adminPinsProblem != null) {
        throw new GradleException("Release build refused: " + adminPinsProblem)
    }
}

android {
    namespace "castech.emvtxn"
    compileSdkVersion 31
    // buildToolsVersion removed - AGP 8.x uses default (33.0.1+)
    defaultConfig {
        applicationId "castech.emvtxn"
        minSdkVersion 24
        targetSdkVersion 31
        // Single source of truth for the app version. MainActivity.APP_VERSION
        // reads BuildConfig.VERSION_NAME, and the APK filename carries it (see
        // applicationVariants below) so fleet pushes (CashHub) are identifiable.
        versionCode 81
        versionName "6.2.19"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        multiDexEnabled true
        // SEC-05: hash + salt of the built-in Super Admin PIN (see the admin-pins.properties block above).
        buildConfigField "String", "BUILT_IN_SUPER_PIN_HASH", "\"${builtInSuperPinHash}\""
        buildConfigField "String", "BUILT_IN_PIN_SALT", "\"${builtInPinSalt}\""
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // The S1F4 PRO terminal runs Android 13 (API 33); the v2 APK
                // Signature Scheme (AGP's default for minSdk >= 24) is what it
                // uses. v1/JAR signing is intentionally left off — it is legacy,
                // unnecessary here, and rejected as a sole scheme on API 30+. The
                // debug build (also v2-only) already installs fine via CasHUB.
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            // Only attach the signing config when the keystore is present, so a
            // keyless checkout still builds (an unsigned release APK). Also skip
            // signing when built with -Punsigned, to hand Castle an UNSIGNED APK
            // for them to sign/wrap with the customer key (trusted CAP).
            if (keystorePropsFile.exists() && !project.hasProperty('unsigned')) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions "keyMode"
    productFlavors {
        dukpt {
            dimension "keyMode"
            buildConfigField "String", "KEY_MODE", "\"DUKPT\""
        }
        mksk {
            dimension "keyMode"
            buildConfigField "String", "KEY_MODE", "\"MKSK\""
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    // Versioned APK filenames for fleet distribution (CashHub):
    //   production (mksk release): S1FP-TFI-v6.2.0.apk
    //   debug builds keep a "-debug" marker so a debuggable APK can never be
    //   mistaken for the production one; the deprecated dukpt flavor keeps a
    //   "-dukpt" marker for the same reason.
    applicationVariants.all { variant ->
        variant.outputs.all {
            String name = "S1FP-TFI-v${variant.versionName}"
            if (variant.flavorName != "mksk") {
                name += "-${variant.flavorName}"
            }
            if (variant.buildType.name != "release") {
                name += "-${variant.buildType.name}"
            }
            // Mark an unsigned build so it can never be mistaken for the signed
            // production APK (it is NOT installable as-is; it's for Castle to sign).
            if (project.hasProperty('unsigned')) {
                name += "-unsigned"
            }
            outputFileName = name + ".apk"
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.4.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // OkHttp + WebSocket for POS-mode proxy connection (castech.emvtxn.pos.*)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    // Real org.json for JVM unit tests (Android bundles its own at runtime)
    testImplementation 'org.json:json:20231013'

    // Encrypted SharedPreferences - DISABLED (crashes Castle terminal)
    // implementation 'androidx.security:security-crypto:1.0.0'
}
